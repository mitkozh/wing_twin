[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wing-twin"
version = "1.0.0"
description = "Real-time wing fatigue monitoring system with force-reconstruction digital twin architecture"
readme = "docs/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wing Digital Twin Team"}
]
keywords = ["digital-twin", "fatigue", "structural-health", "strain-gauge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "paho-mqtt>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "websockets>=11.0.0",
    "py_fatigue>=2.0.0",
    "matplotlib",
    "vtk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
wing-orchestrator = "scripts.orchestrator:main"
wing-demo = "scripts.demo:main"
wing-simulator = "scripts.simulator:main"
wing-test = "scripts.test_offline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dtwin*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"