[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wing-twin"
version = "2.0.0"
description = "Real-time wing fatigue monitoring system with force-reconstruction digital twin architecture"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wing Digital Twin Team"}
]
keywords = ["digital-twin", "fatigue", "structural-health", "strain-gauge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "paho-mqtt>=2.0.0",
    "numpy>=1.24.0,<2",
    "scipy>=1.10.0",
    "websockets>=11.0.0",
    "py_fatigue>=2.0.0",
    "matplotlib",
    "h5py>=3.8.0",
    "vtk",
    "neuralfoil>=0.3.2",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
wing-real-run = "wing_twin.cli.run:main"
wing-demo-run = "wing_twin.cli.demo:main"
wing-simulator = "wing_twin.cli.simulator:main"
wing-mesh-export = "wing_twin.cli.mesh_export:main"
wing-neuralfoil-export = "wing_twin.cli.neuralfoil_export:main"
wing-dashboard = "wing_twin.viz.dashboard:run_dashboard"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wing_twin*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"